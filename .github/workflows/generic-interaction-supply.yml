name: Generic higher-order synthetic contracts
on:
  push:
    branches: [lc-generic-supply]
    paths: ['generic_interaction_supply.py','test_generic_interaction_supply.py','generic_graph_supply_bank.py','generic_validation_supply.py','generic_expression_supply.py','test_generic_expression_supply.py','test_generic_validation_supply.py','test_generic_graph_supply_bank.py','phase0_generic_dag.py','.github/workflows/generic-interaction-supply.yml']
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Synthetic observation contracts
        run: python -B -m unittest -v test_generic_interaction_supply test_generic_graph_supply_bank test_generic_validation_supply test_generic_expression_supply
