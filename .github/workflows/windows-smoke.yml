name: Hosted Windows smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Verify hosted Windows and exact checkout
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Expected GitHub-hosted Windows' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Wrong checkout' }
          python --version
          git --version
      - name: Synthetic Windows regression checks
        run: python -B -m unittest -v test_cloud_smoke test_acceptance_contract
